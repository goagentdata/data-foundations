# contracts, stage 2: one block per key field, with a check that tests the meaning.
# Our own small layout, not a standard. Move to stage 3 (ODCS) when a data person owns the file.
# Names and people are made up. Version 0.1.0, license MIT.
contract_version: 1.0.0        # a change in meaning is a major version: 2.0.0
last_reviewed: 2026-11-11
fields:
  - field: customers.is_active_customer
    meaning: The customer placed an order in the 90 days before the flag was computed.
    who_is_counted: real customers; rows with is_test = true are never counted
    period: rolling 90 days up to flag_computed_at, UTC
    producer_owner: a.cohen      # owns the field at its source and every change to it
    definition_owner: m.levi     # decides what the flag means
    consumers: [weekly review, investor update, analytics agent]
    change_rule: a change to the window, the event or who is counted is a change in meaning; major version, owners approve, consumers told before it ships
    check: contracts/drift_check.postgres.sql   # must return disagreeing = 0, or within a tolerance the owners agree
